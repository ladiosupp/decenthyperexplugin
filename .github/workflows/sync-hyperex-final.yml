name: Finalize HyperEx v0.1.48 source
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  sync:
    if: github.event.issue.title == 'HyperEx v0.1.48 final sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild verified source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload = ''.join(Path(f'HyperExPatch_sync.part{i:02d}').read_text() for i in range(9))
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          Path('/tmp/hyperex-148.patch').write_bytes(patch)
          PY
          sha256sum /tmp/hyperex-148.patch
      - name: Apply source patch and cleanup
        run: |
          git apply --check /tmp/hyperex-148.patch
          git apply /tmp/hyperex-148.patch
          rm -f decenthyperexplugin.reaplugin/HyperEx_Pulse_Filter.json
          rm -f HyperExPatch_sync.part* HyperExPatch_sync.complete HyperExManifest_sync.b64
          rm -f HyperExPulseFilter_sync.part* HyperExPulseFilter_sync.complete
          rm -f SYNC_TRIGGER_NOTE.txt SYNC_TRIGGER_NOTE_2.txt CLEANUP_ABORTED_SYNC.txt _noop_cleanup_marker.txt
          rm -f .github/workflows/sync-hyperex-final.yml
      - name: Verify synchronized source
        run: |
          grep -q '"version": "0.1.48"' decenthyperexplugin.reaplugin/manifest.json
          grep -q 'adaptiveHistoryFileV2' decenthyperexplugin.reaplugin/plugin.js
          grep -q 'v0.1.48 profile truth guard' decenthyperexplugin.reaplugin/README.md
          test ! -e decenthyperexplugin.reaplugin/HyperEx_Pulse_Filter.json
      - name: Commit v0.1.48 source
        run: |
          git config user.name 'HyperEx Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Sync HyperEx Pulse Filter v0.1.48 source'
          git push
