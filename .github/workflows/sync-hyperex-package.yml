name: Sync HyperEx package
on:
  push:
    paths:
      - 'HyperExPulseFilter_sync.zip'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack plugin package
        run: |
          rm -rf /tmp/hyperex-sync
          mkdir -p /tmp/hyperex-sync
          unzip -q HyperExPulseFilter_sync.zip -d /tmp/hyperex-sync
          cp -f /tmp/hyperex-sync/decenthyperexplugin.reaplugin/plugin.js decenthyperexplugin.reaplugin/plugin.js
          cp -f /tmp/hyperex-sync/decenthyperexplugin.reaplugin/manifest.json decenthyperexplugin.reaplugin/manifest.json
          cp -f /tmp/hyperex-sync/decenthyperexplugin.reaplugin/README.md decenthyperexplugin.reaplugin/README.md
          cp -f /tmp/hyperex-sync/decenthyperexplugin.reaplugin/HyperEx_Flow_Calibration_Low_Water.json decenthyperexplugin.reaplugin/HyperEx_Flow_Calibration_Low_Water.json
          cp -f /tmp/hyperex-sync/decenthyperexplugin.reaplugin/HyperEx_Flow_Calibration_Full.json decenthyperexplugin.reaplugin/HyperEx_Flow_Calibration_Full.json
          rm -f decenthyperexplugin.reaplugin/HyperEx_Pulse_Filter.json
          rm -f HyperExPulseFilter_sync.zip
          rm -f .github/workflows/sync-hyperex-package.yml
      - name: Commit synchronized v0.1.48 source
        run: |
          git config user.name 'HyperEx Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Sync HyperEx Pulse Filter v0.1.48 source'
          git push
