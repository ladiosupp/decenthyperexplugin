name: Sync HyperEx v0.1.48 source
on:
  push:
    paths:
      - 'HyperExPatch_sync.complete'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified 1.41 to 1.48 source patch
        run: |
          cat HyperExPatch_sync.part* | base64 -d | gzip -d > /tmp/hyperex-148.patch
          git apply --check /tmp/hyperex-148.patch
          git apply /tmp/hyperex-148.patch
          cat HyperExManifest_sync.b64 | base64 -d | gzip -d > decenthyperexplugin.reaplugin/manifest.json
          rm -f decenthyperexplugin.reaplugin/HyperEx_Pulse_Filter.json
          rm -f HyperExPatch_sync.part* HyperExPatch_sync.complete HyperExManifest_sync.b64
          rm -f HyperExPulseFilter_sync.part* HyperExPulseFilter_sync.complete
          rm -f .github/workflows/sync-hyperex-package.yml
      - name: Verify synchronized source
        run: |
          grep -q '0.1.48' decenthyperexplugin.reaplugin/manifest.json
          grep -q 'adaptiveHistoryFileV2' decenthyperexplugin.reaplugin/plugin.js
          grep -q 'profile truth' decenthyperexplugin.reaplugin/README.md
          test ! -e decenthyperexplugin.reaplugin/HyperEx_Pulse_Filter.json
      - name: Commit synchronized v0.1.48 source
        run: |
          git config user.name 'HyperEx Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Sync HyperEx Pulse Filter v0.1.48 source'
          git push
