<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121418">
<title>ProfileReplayer</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#121418;color:#e8eaee;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #262a31;background:#171a1f;flex:none;min-width:0}
h1{font-size:17px;margin:0;letter-spacing:.02em}
header .status{margin-left:auto;font-size:12px;color:#9fd4a8;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .status.busy{color:#e9c276}
.fetchbtn{flex:none;display:inline-flex;align-items:center;gap:7px;background:#e8833a;color:#1a1208;border:0;border-radius:9px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;transition:filter .12s,transform .08s;white-space:nowrap}
.fetchbtn:hover{filter:brightness(1.08)}
.fetchbtn:active{transform:scale(.96)}
.fetchbtn .fetch-count{font:11px ui-monospace,monospace;font-weight:600;background:rgba(26,18,8,.18);border-radius:6px;padding:1px 6px;min-width:34px;text-align:center}
.fetchbtn.busy{filter:saturate(.7) brightness(.92);cursor:default}
.fetchbtn.busy .fetch-ico{display:inline-block;animation:fetchspin 1s linear infinite}
@keyframes fetchspin{to{transform:rotate(360deg)}}
@media (max-width:600px){header{gap:8px;padding:10px 12px}h1{font-size:15px}.fetchbtn{padding:6px 10px;font-size:12px}.fetchbtn .fetch-count{min-width:30px}}
@media (max-width:480px){header h1{display:none}header .status{font-size:11px}.fetchbtn{padding:6px 9px;font-size:12px;gap:5px}}
main{flex:1;display:flex;min-height:0}
aside{width:340px;flex:none;border-right:1px solid #262a31;padding:14px;overflow-y:auto;overflow-x:hidden}
section.view{flex:1;min-width:0;padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column}
fieldset{border:1px solid #2b3038;border-radius:10px;margin:0 0 12px;padding:10px 12px;min-width:0}
legend{font-size:11px;letter-spacing:.08em;color:#8b93a1;padding:0 4px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;font-size:13px;color:#c6ccd6}
input[type=text],input[type=url]{width:100%;background:#0e1116;color:#e8eaee;border:1px solid #333a44;border-radius:8px;padding:9px 10px;font:13px ui-monospace,monospace}
select{background:#0e1116;color:#e8eaee;border:1px solid #333a44;border-radius:8px;padding:8px;font:13px ui-monospace,monospace;width:100%}
button{border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#2a2f37;color:#cfd5de;transition:filter .12s,transform .08s}
button:not(:disabled):hover{filter:brightness(1.15)}
button:not(:disabled):active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:#e8833a;color:#1a1208;width:100%;margin-top:6px}
button.ghost{width:100%;margin-top:8px}
.cupdrop{position:relative}
.cupdrop-btn{display:flex;align-items:center;gap:8px;width:100%;background:#0e1116;color:#e8eaee;border:1px solid #333a44;border-radius:8px;padding:9px 10px;font:13px ui-monospace,monospace;text-align:left;cursor:pointer}
.cupdrop-btn .cupdrop-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cupdrop-btn .cupdrop-arrow{flex:none;color:#8b93a1;font-size:11px;transition:transform .15s}
.cupdrop.open .cupdrop-btn{border-color:#e8833a}
.cupdrop.open .cupdrop-arrow{transform:rotate(180deg)}
.cupdrop-panel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:#14171c;border:1px solid #333a44;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.55);max-height:300px;overflow-y:auto;overscroll-behavior:contain;padding:4px}
.cupdrop-panel::-webkit-scrollbar{width:10px}
.cupdrop-panel::-webkit-scrollbar-track{background:#0e1116;border-radius:5px}
.cupdrop-panel::-webkit-scrollbar-thumb{background:#3a4150;border-radius:5px;border:2px solid #0e1116}
.cupdrop-panel::-webkit-scrollbar-thumb:hover{background:#4a5264}
.cupdrop-panel{scrollbar-width:thin;scrollbar-color:#3a4150 #0e1116}
.cupdrop-item{padding:8px 10px;border-radius:7px;font:12px ui-monospace,monospace;color:#c6ccd6;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cupdrop-item:hover{background:#222732}
.cupdrop-item.sel{background:#2c3442;color:#e8eaee;box-shadow:inset 3px 0 0 #e8833a}
.cupdrop-item.sel{white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word}
.cupdrop-item.bad{background:#2a1518;color:#e09aa2}
.cupdrop-item.bad:hover{background:#33191d}
.cupdrop-item.bad.sel{background:#33191d;color:#f2b8be;box-shadow:inset 3px 0 0 #c96470}
.cupdrop.compact{flex:none}
.cupdrop.compact .cupdrop-btn{width:auto;padding:8px 10px;font-size:13px}
.cupdrop.compact .cupdrop-panel{left:auto;right:0;min-width:110px;max-height:260px}
.cupdrop.compact .cupdrop-item{text-align:right}
.cupdrop.compact .cupdrop-item.sel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:12px;color:#8b93a1;margin:8px 0 0}
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px;flex:none}
.card{background:#191d23;border:1px solid #2a2f38;border-radius:10px;padding:8px 10px;min-width:0;container-type:inline-size}
.card .k{font-size:11px;font-size:clamp(9px,10cqi,11px);color:#8b93a1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .v{font-size:18px;font-size:clamp(8px,13cqi,18px);font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .s{font-size:11px;font-size:clamp(8px,8.5cqi,11px);color:#8b93a1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phasepill{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.good{color:#7ed492}.warn{color:#e9c276}.bad{color:#f2909a}
.chartbox{background:#171a1f;border:1px solid #262a31;border-radius:10px;padding:8px 10px 4px;margin-bottom:10px;flex:none}
.chartbox h3{margin:2px 0 4px;font-size:12px;color:#aab2bf;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.charthandle{flex:none;cursor:grab;color:#5b6472;padding:2px 8px;margin:-2px 0 -2px -6px;border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:13px;letter-spacing:1px}
.charthandle:hover{color:#9aa3b2;background:#222732}
.chartbox.dragging{opacity:.35}
.chartbox.drop-target{border-color:#e8833a;box-shadow:0 0 0 1px rgba(232,131,58,.4)}
.chartghost{position:fixed;left:0;top:0;z-index:99;margin:0;pointer-events:none;opacity:.92;border-color:#e8833a;box-shadow:0 10px 30px rgba(0,0,0,.55);will-change:transform}
body.chart-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
canvas{width:100%;height:150px;display:block;touch-action:pan-y}
.events{background:#171a1f;border:1px solid #262a31;border-radius:10px;padding:8px 10px;font:12px ui-monospace,monospace;color:#aeb6c2;max-height:220px;overflow:auto;flex:none}
.events .row{display:flex;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.events .row:hover{background:#222732}
.events .row.now{background:#2c3442;color:#e8eaee}
.events .row .t{color:#7d8592;flex:none;width:64px;text-align:right}
.events .row .tag{flex:none;width:150px;overflow:hidden;text-overflow:ellipsis}
.events .row.trace .tag{color:#d5a8f5}
.events .row:not(.trace) .tag{color:#9cc0ff}
.events .row .d{overflow:hidden;text-overflow:ellipsis}
.transport{position:sticky;top:-14px;z-index:5;background:#171a1f;border:1px solid #2a2f38;border-radius:12px;padding:10px 12px;margin-bottom:12px;flex:none}
.tbar{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;min-width:0}
.tbar button{padding:10px 12px;font-size:15px;min-width:44px}
.tbar button.play{background:#e8833a;color:#1a1208;min-width:86px}
.tbar button.play.active{box-shadow:0 0 0 2px rgba(232,131,58,.35)}
.tbar select{width:auto;padding:8px}
.tbar label{margin:0;font-size:13px}
.tbar .pos{margin-left:auto;font:13px ui-monospace,monospace;color:#c6ccd6;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:6px 0 0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#2b3038}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#e8833a;margin-top:-7px;border:0}
input[type=range]:disabled{opacity:.4;cursor:default}
.phasepill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#2a2f37;color:#cfd5de}
.evdata{margin:4px 0 0;font:12px ui-monospace,monospace;color:#c6ccd6;white-space:pre-wrap;max-height:220px;overflow:auto}
.rawtoggle{display:flex;align-items:center;gap:5px;margin:0;font-size:11px;color:#8b93a1;cursor:pointer;font-weight:400}
.rawtoggle input{width:15px;height:15px;margin:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2b3038;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:#2b3038 transparent}
.modal-dim{position:fixed;inset:0;z-index:50;background:rgba(6,8,10,.74);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{width:100%;max-width:340px;background:#191d23;border:1px solid #333a44;border-radius:14px;padding:16px 16px 14px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.modal h3{margin:0 0 3px;font-size:16px;font-weight:700}
.modal .why{margin:0 0 12px;font-size:12px;color:#8b93a1}
.plug{display:flex;align-items:flex-start;gap:10px;background:#14171c;border:1px solid #2a2f38;border-radius:10px;padding:10px 11px;margin-bottom:8px}
.plug .ico{flex:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;margin-top:1px}
.plug.hx .ico{background:#3d2c17;color:#f5c078}
.plug.rc .ico{background:#20304d;color:#9cc0ff}
.plug .nm{font-size:13.5px;font-weight:700}
.plug .ver{font-size:11px;color:#8b93a1;font-variant-numeric:tabular-nums}
.plug .desc{font-size:11px;color:#8b93a1;margin-top:2px}
.plug .badge{flex:none;margin-left:auto;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.plug .badge.ok{background:#173a2a;color:#8fe0b0}
.plug .badge.no{background:#3d1d22;color:#f2a0aa}
.ghbtn{display:block;width:100%;margin-top:2px;background:#2a2f37;color:#cfd5de;border:0;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700;text-align:left;cursor:pointer}
.ghbtn small{display:block;font-weight:400;font-size:11px;color:#8b93a1;font-family:ui-monospace,monospace;margin-top:1px}
.modal-actions{display:flex;gap:8px;margin-top:13px}
.modal-actions button{flex:1;border:0;border-radius:10px;padding:11px 10px;font-size:14px;font-weight:700;cursor:pointer}
.modal-actions .primary{background:#e8833a;color:#1a1208}
.modal-actions .ghost{background:#2a2f37;color:#cfd5de}
.modal-foot{margin-top:10px;font-size:11px;color:#6b7380;text-align:center}
@media (max-width:900px){main{flex-direction:column;overflow-y:auto}aside{width:100%;border-right:0;border-bottom:1px solid #262a31;overflow:visible}section.view{overflow:visible}}
@media (max-width:600px){.cards{gap:4px}.card{padding:5px 4px;border-radius:7px}.card .v{font-size:clamp(7px,13cqi,18px)}}
@media (max-width:340px){.cards{gap:3px}.card{padding:4px 3px}}
</style>
</head>
<body>
<header>
  <h1 data-i18n="ProfileReplayer">ProfileReplayer</h1>
  <button type="button" class="fetchbtn" id="manualFetch"><span class="fetch-ico">⟳</span><span class="fetch-txt" data-i18n="抓取">抓取</span><span class="fetch-count" id="fetchCount">—</span></button>
  <select id="lang" style="width:auto;padding:6px 8px"><option value="zh">中文</option><option value="en">EN</option></select>
  <span class="status" id="status">载入中…</span>
</header>
<main>
<aside>
  <fieldset><legend data-i18n="选择杯">选择杯</legend>
    <select id="cup" style="display:none"><option>—</option></select>
    <div class="cupdrop" id="cupDrop">
      <button type="button" class="cupdrop-btn" id="cupDropBtn" aria-haspopup="listbox" aria-expanded="false"><span class="cupdrop-label" id="cupDropLabel">—</span><span class="cupdrop-arrow">▾</span></button>
      <div class="cupdrop-panel" id="cupDropPanel" role="listbox" hidden></div>
    </div>
    <div class="note" id="cupInfo"></div>
  </fieldset>
  <fieldset><legend data-i18n="数据源 · Decaid 地址">数据源 · Decaid 地址</legend>
    <input type="url" id="srcUrl" data-i18n-ph="http://平板IP:端口/api/v1/plugins/decenthyperexplugin.reaplugin/history-export" placeholder="http://平板IP:端口/api/v1/plugins/decenthyperexplugin.reaplugin/history-export">
    <button class="primary" id="fetchNow" data-i18n="抓取并合并">抓取并合并</button>
    <label style="margin-top:10px"><span data-i18n="自动抓取">自动抓取</span><input type="checkbox" id="autoOn" style="width:20px;height:20px"></label>
    <label><span data-i18n="间隔">间隔</span><select id="autoSec" style="width:110px"><option value="30" data-i18n="30 秒">30 秒</option><option value="60" data-i18n="1 分钟">1 分钟</option><option value="120" selected data-i18n="2 分钟">2 分钟</option><option value="300" data-i18n="5 分钟">5 分钟</option><option value="600" data-i18n="10 分钟">10 分钟</option></select></label>
    <p class="note" id="autoNote" data-i18n="默认 2 分钟抓一次，赶在插件裁剪全点（最新 4 杯）之前补全；装 APK 后后台也照抓。">默认 2 分钟抓一次，赶在插件裁剪全点（最新 4 杯）之前补全；装 APK 后后台也照抓。</p>
  </fieldset>
  <fieldset><legend data-i18n="本地导入">本地导入</legend>
    <button class="ghost" id="pickFile" data-i18n="选择已下载的 JSON">选择已下载的 JSON</button>
    <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
    <p class="note" data-i18n="兼容浏览器下载到 Download 的 hyperex-history.json，也兼容归档文件。">兼容浏览器下载到 Download 的 hyperex-history.json，也兼容归档文件。</p>
  </fieldset>
  <fieldset><legend data-i18n="归档">归档</legend>
    <div class="note" id="archiveInfo">—</div>
    <button class="ghost" id="exportArchive" data-i18n="导出归档 JSON">导出归档 JSON</button>
    <button class="ghost" id="clearArchive" style="color:#f2909a" data-i18n="清空归档">清空归档</button>
  </fieldset>
</aside>
<section class="view">
  <div class="transport">
    <div class="tbar">
      <button id="btnStart" title="开头">⏮︎</button>
      <button id="btnPrevEv" title="上一个事件">⏪︎</button>
      <button id="btnRev" class="play">◀ 倒放</button>
      <button id="btnPlay" class="play">顺放 ▶</button>
      <button id="btnNextEv" title="下一个事件">⏩︎</button>
      <button id="btnEnd" title="结尾">⏭︎</button>
      <select id="speed" style="display:none"><option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="10">10×</option></select>
      <div class="cupdrop compact" id="speedDrop">
        <button type="button" class="cupdrop-btn" id="speedDropBtn" aria-haspopup="listbox" aria-expanded="false"><span class="cupdrop-label" id="speedDropLabel">1×</span><span class="cupdrop-arrow">▾</span></button>
        <div class="cupdrop-panel" id="speedDropPanel" role="listbox" hidden></div>
      </div>
      <label><input type="checkbox" id="loop"> <span data-i18n="循环">循环</span></label>
      <span class="pos" id="pos">— / —</span>
    </div>
    <input type="range" id="scrub" min="0" max="0" value="0" step="1" disabled>
  </div>
  <div class="cards" id="cards"></div>
  <div class="chartbox" data-chart="cFlow"><h3><span class="charthandle" title="长按拖动排序">⠿</span><span data-i18n="杯流 (g/s)">杯流 (g/s)</span><label class="rawtoggle"><input type="checkbox" id="rawToggle"> RAW dW/dt</label></h3><canvas id="cFlow"></canvas></div>
  <div class="chartbox" data-chart="cWeight"><h3><span class="charthandle" title="长按拖动排序">⠿</span><span data-i18n="秤重 (g)">秤重 (g)</span></h3><canvas id="cWeight"></canvas></div>
  <div class="chartbox" data-chart="cPress"><h3><span class="charthandle" title="长按拖动排序">⠿</span><span data-i18n="压力 (bar) · 流量 (ml/s)">压力 (bar) · 流量 (ml/s)</span></h3><canvas id="cPress"></canvas></div>
  <div class="events" id="log"></div>
</section>
</main>
<script src="archive-core.js"></script>
<script src="app.js"></script>
</body>
</html>
